name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make check

      - name: Validate release notes
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Build release archives
        run: |
          build_date=$(git show -s --format=%cI "$GITHUB_SHA")
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          ./scripts/build-release.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$build_date" \
            "$source_epoch" \
            dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bible-cli_*.tar.gz \
            dist/checksums.txt \
            --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Bible CLI $GITHUB_REF_NAME"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/bible-cli.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bible-cli_*.tar.gz
            dist/checksums.txt

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/bible-cli_*.tar.gz
            dist/checksums.txt
          sbom-path: dist/bible-cli.spdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/bible-cli.spdx.json --clobber

      - name: Check Homebrew tap credentials
        if: ${{ !contains(github.ref_name, '-') }}
        id: homebrew-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew tap
        if: ${{ steps.homebrew-token.outputs.available == 'true' }}
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4
        with:
          formula-name: bible-cli
          formula-path: Formula/bible-cli.rb
          homebrew-tap: vmrocha/homebrew-tap
          base-branch: main
          create-pullrequest: false
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Embed build metadata in tap formula
        if: ${{ steps.homebrew-token.outputs.available == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -uo pipefail
          if ! (
            set -euo pipefail
            build_date=$(git show -s --format=%cI "$COMMIT")

            tap=$(mktemp -d)
            git -c http.extraheader="AUTHORIZATION: bearer ${HOMEBREW_TAP_TOKEN}" \
              clone --quiet --depth 1 \
              https://github.com/vmrocha/homebrew-tap.git "$tap"

            formula="$tap/Formula/bible-cli.rb"
            if ! grep -q 'buildinfo.commit=' "$formula"; then
              echo "formula declares no commit ldflag; nothing to embed"
              exit 0
            fi

            sed -i \
              -e "s|buildinfo.commit=[^ ]*|buildinfo.commit=${COMMIT}|" \
              -e "s|buildinfo.date=[^ ]*|buildinfo.date=${build_date}|" \
              "$formula"

            cd "$tap"
            if git diff --quiet; then
              echo "Tap formula already carries the release metadata."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -am "bible-cli ${VERSION}: embed commit and build date"
            git -c http.extraheader="AUTHORIZATION: bearer ${HOMEBREW_TAP_TOKEN}" \
              push --quiet origin HEAD:main
          ); then
            echo "::warning::could not embed build metadata in the tap formula; brew builds will report unknown commit/date"
          fi

      - name: Report missing Homebrew tap credentials
        if: ${{ steps.homebrew-token.outputs.available == 'false' }}
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not configured; the Homebrew formula was not updated."
