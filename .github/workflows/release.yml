name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make check

      - name: Validate release notes
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Build release archives
        run: |
          build_date=$(git show -s --format=%cI "$GITHUB_SHA")
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          ./scripts/build-release.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$build_date" \
            "$source_epoch" \
            dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bible-cli_*.tar.gz \
            dist/checksums.txt \
            --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Bible CLI $GITHUB_REF_NAME"

      - name: Check Homebrew tap credentials
        if: ${{ !contains(github.ref_name, '-') }}
        id: homebrew-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebrew tap
        if: ${{ steps.homebrew-token.outputs.available == 'true' }}
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4
        with:
          formula-name: bible-cli
          formula-path: Formula/bible-cli.rb
          homebrew-tap: vmrocha/homebrew-tap
          base-branch: main
          create-pullrequest: false
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report missing Homebrew tap credentials
        if: ${{ steps.homebrew-token.outputs.available == 'false' }}
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not configured; the Homebrew formula was not updated."
